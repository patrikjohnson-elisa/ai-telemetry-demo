[project]
name = "ai-tool-telemetry-demo"
version = "0.1.0"
description = "Tool-agnostic OpenTelemetry tracking for AI coding assistants, stored in OpenObserve"
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-proto>=1.45.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
